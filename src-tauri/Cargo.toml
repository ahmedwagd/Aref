[package]
name = "aref"
version = "0.1.0"
edition = "2021"
description = "Aref - local-first Arabic/English writing assistant"
publish = false

[lib]
name = "aref_lib"
crate-type = ["rlib"]

[profile.release]
codegen-units = 1
lto = true

[dependencies]
keyring = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tauri = "2"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

[features]
# Not in `default`: `InMemoryKeyStore` must be absent from every shipped build
# (design.md §5.5). Enable it to use the credential-store double from an integration
# test; the crate's own unit tests reach it with `cfg(test)` instead.
default = []
test-support = []

[build-dependencies]
tauri-build = "2.7.4"
