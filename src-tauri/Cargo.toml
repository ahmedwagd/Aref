[package]
name = "aref"
version = "0.1.0"
edition = "2021"
description = "Aref - local-first Arabic/English writing assistant"
publish = false

[lib]
name = "aref_lib"
crate-type = ["rlib"]

[profile.release]
codegen-units = 1
lto = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2"
thiserror = "2.0.21"

[build-dependencies]
tauri-build = "2.7.4"
